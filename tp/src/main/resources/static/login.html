<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Pulse - Login</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #111;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
            border: 1px solid #333;
        }
        h2 { margin-top: 0; margin-bottom: 24px; color: #fff; }
        .form-group { text-align: left; margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #ff2a2a; }
        .error { color: #ff2a2a; font-size: 14px; margin-bottom: 12px; display: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #ff2a2a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background: #d41d1d; }
        .footer { margin-top: 20px; font-size: 14px; color: #888; }
        .footer a { color: #ff2a2a; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Login to Team Pulse</h2>
    <div id="error-msg" class="error">Invalid credentials</div>
    <form id="login-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <div class="footer">
        New here? <a href="register.html">Register here</a>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                const userData = await res.json();
                localStorage.setItem('tp_user_id', userData.userId);
                localStorage.setItem('tp_user_name', userData.name);
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.innerText = await res.text();
            }
        } catch (err) {
            errorMsg.style.display = 'block';
            errorMsg.innerText = 'Network error';
        }
    });
</script>

</body>
</html>
