<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Pulse - Register</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #111;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 700px;
            text-align: center;
            border: 1px solid #333;
            max-height: 90vh;
            overflow-y: auto;
        }
        h2 { margin-top: 0; margin-bottom: 24px; color: #fff; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: left; }
        .form-group { position: relative; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus, select:focus { outline: none; border-color: #ff2a2a; }
        
        .username-check {
            position: absolute;
            right: 10px;
            top: 32px;
            font-size: 16px;
        }
        .check-ok { color: #00e676; }
        .check-fail { color: #ff2a2a; }

        .error { color: #ff2a2a; font-size: 14px; margin-bottom: 12px; display: none; }
        
        button {
            width: 100%;
            padding: 12px;
            background: #ff2a2a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background: #d41d1d; }
        button:disabled { background: #555; cursor: not-allowed; }
        .footer { margin-top: 20px; font-size: 14px; color: #888; }
        .footer a { color: #ff2a2a; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Register for Team Pulse</h2>
    <div id="error-msg" class="error"></div>
    <form id="register-form">
        <div class="form-grid">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="off">
                <span id="username-status" class="username-check"></span>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" min="1" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="" disabled selected>Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="company">Company</label>
                <select id="company" required>
                    <option value="" disabled selected>Select Company</option>
                    <option value="Company 1">Company 1</option>
                    <option value="Company 2">Company 2</option>
                    <option value="teampulse">teampulse</option>
                    <option value="Company 4">Company 4</option>
                    <option value="Company 5">Company 5</option>
                    <option value="Company 6">Company 6</option>
                    <option value="Company 7">Company 7</option>
                    <option value="Company 8">Company 8</option>
                    <option value="Company 9">Company 9</option>
                    <option value="Company 10">Company 10</option>
                </select>
            </div>
            <div class="form-group">
                <label for="position">Position</label>
                <input type="text" id="position" required>
            </div>
        </div>
        
        <button type="submit" id="submit-btn" disabled>Register</button>
    </form>
    <div class="footer">
        Already have an account? <a href="login.html">Login here</a>
    </div>
</div>

<script>
    let isUsernameValid = false;
    const usernameInput = document.getElementById('username');
    const usernameStatus = document.getElementById('username-status');
    const submitBtn = document.getElementById('submit-btn');

    let debounceTimer;

    usernameInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const username = usernameInput.value.trim();
        
        if (!username) {
            usernameStatus.innerHTML = '';
            isUsernameValid = false;
            updateSubmitButton();
            return;
        }

        usernameStatus.innerHTML = '...';
        
        debounceTimer = setTimeout(async () => {
            try {
                const res = await fetch(`/api/auth/check-username?username=${encodeURIComponent(username)}`);
                const exists = await res.json();
                
                if (exists) {
                    usernameStatus.innerHTML = '<span class="check-fail">✗</span>';
                    isUsernameValid = false;
                } else {
                    usernameStatus.innerHTML = '<span class="check-ok">✓</span>';
                    isUsernameValid = true;
                }
                updateSubmitButton();
            } catch(e) {
                usernameStatus.innerHTML = '';
            }
        }, 300); // 300ms debounce
    });

    function updateSubmitButton() {
        submitBtn.disabled = !isUsernameValid;
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!isUsernameValid) return;

        const data = {
            email: document.getElementById('email').value,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            name: document.getElementById('name').value,
            age: parseInt(document.getElementById('age').value),
            gender: document.getElementById('gender').value,
            company: document.getElementById('company').value,
            position: document.getElementById('position').value
        };

        const errorMsg = document.getElementById('error-msg');

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                window.location.href = 'login.html';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.innerText = await res.text();
            }
        } catch (err) {
            errorMsg.style.display = 'block';
            errorMsg.innerText = 'Network error';
        }
    });
</script>

</body>
</html>
